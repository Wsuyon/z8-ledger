<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d21;--text-2:#6b7280;--text-3:#9ca3af;--border:#eceef1;--accent:#0ea5a3;--accent-soft:#e6f6f5;--income:#10b981;--income-soft:#e8f9f1;--expense:#f43f5e;--expense-soft:#fdeef1;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,245,247,.92);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{font-size:17px;font-weight:700;letter-spacing:-.02em}.brand .dot{color:var(--accent)}
.nav{margin-left:auto;display:flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:3px}
.nav button{text-decoration:none;color:var(--text-2);font-size:14px;font-weight:500;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;transition:all .15s}
.nav button.active{background:var(--text);color:#fff}
.gear{border:none;background:transparent;font-size:18px;cursor:pointer;color:var(--text-2);padding:4px}
.app{max-width:1080px;margin:0 auto;padding:0 16px 110px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .hint{font-size:12px;font-weight:400;color:var(--text-3);margin-left:auto}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.stat .label{font-size:12px;color:var(--text-2)}.stat .value{font-size:20px;font-weight:700;margin-top:4px}
.stat .value.income{color:var(--income)}.stat .value.expense{color:var(--expense)}.stat .value.accent{color:var(--accent)}
.stat .sub{font-size:11px;color:var(--text-3);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:14px;font-weight:500;padding:8px 14px;border-radius:10px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#d1d5db;background:#fafafa}
.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn.danger{color:var(--expense);border-color:#fecdd3}
.btn.danger:hover{background:var(--expense-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%;padding:12px;font-size:16px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:15px;font-family:inherit;color:var(--text);background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:flex;gap:10px}.field-row .field{flex:1}
.seg{display:flex;background:#eef0f3;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-size:15px;font-weight:600;color:var(--text-2);cursor:pointer}
.seg button.active{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.seg button.active.expense{color:var(--expense)}.seg button.active.income{color:var(--income)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text-2)}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.tl-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.tl-item:last-child{border-bottom:none}
.tl-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tl-main{flex:1;min-width:0}.tl-title{font-size:15px;font-weight:600}.tl-title .cat{color:var(--text-2);font-weight:500;font-size:13px}
.tl-meta{font-size:12px;color:var(--text-3);margin-top:2px}
.tl-amount{font-size:16px;font-weight:700;white-space:nowrap}.tl-amount.income{color:var(--income)}.tl-amount.expense{color:var(--expense)}
.acct-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
.acct-item:last-child{border-bottom:none}
.acct-avatar{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:#f0f1f4}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;margin-left:6px}
.badge.active{background:#fff7e6;color:#d97706}.badge.settled{background:var(--income-soft);color:var(--income)}.badge.bad_debt{background:var(--expense-soft);color:var(--expense)}
.empty{text-align:center;color:var(--text-3);padding:32px 16px;font-size:14px}
.thumb-row{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--border)}
.thumb.lg{width:100%;height:auto}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 20px 32px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:700}
.close-x{border:none;background:#f0f1f4;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--text-2)}
.legend-row{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--border)}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:8px}
.footer{text-align:center;color:var(--text-3);font-size:12px;padding:20px 0 8px}
.hidden{display:none!important}
.muted{color:var(--text-2)}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}
.flex{display:flex;align-items:center;gap:8px}.spread{justify-content:space-between}
svg.chart{width:100%;height:auto;display:block}
.hero{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px 16px;margin-top:14px;position:relative}
.hero .hl{font-size:13px;color:var(--text-2)}
.hero .hv{font-size:36px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.hero .hv.pos{color:var(--income)}.hero .hv.neg{color:var(--expense)}
.hero .hsub{font-size:12px;color:var(--text-3);margin-top:2px}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini{background:#f8f9fa;border-radius:10px;padding:10px 12px}
.mini .label{font-size:11px;color:var(--text-2)}
.mini .value{font-size:16px;font-weight:700;margin-top:2px}
.mini .value.expense{color:var(--expense)}.mini .value.income{color:var(--income)}.mini .value.accent{color:var(--accent)}
.hero-entry{position:absolute;top:12px;right:12px}
.fab{position:fixed;right:20px;bottom:28px;z-index:30;width:58px;height:58px;border-radius:50%;background:var(--text);color:#fff;border:none;font-size:30px;line-height:1;box-shadow:0 6px 20px rgba(16,24,40,.28);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.94)}
.side-mask{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.side-mask.show{opacity:1;pointer-events:auto}
.side-panel{position:fixed;top:0;right:0;bottom:0;width:88%;max-width:420px;background:#fff;z-index:51;transform:translateX(100%);transition:transform .25s;box-shadow:-8px 0 30px rgba(16,24,40,.12);display:flex;flex-direction:column}
.side-panel.show{transform:translateX(0)}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
.side-head .title{font-size:17px;font-weight:700}
.side-body{padding:16px;overflow-y:auto;flex:1}
.acct-actions{display:flex;gap:6px;margin-top:4px;justify-content:flex-end;flex-wrap:wrap}
.span-row{display:flex;gap:6px;flex-wrap:wrap}
@media(min-width:720px){.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.two-col .card{margin-top:14px}.mask{align-items:center}.modal{border-radius:20px}.fab{right:calc(50% - 540px + 20px)}}
</style>

  <div class="footer">数据保存在本机浏览器 · <a href="#" onclick="openBackup(event)" style="color:var(--accent)">导出备份</a> · <a href="#" onclick="openImport(event)" style="color:var(--accent)">导入</a></div>

<script>
/* ============ 存储层（IndexedDB，失败自动回退 localStorage） ============ */
const DB_NAME='z8-ledger', DB_VER=1
let db=null
let backend='idb'
const STORES=['accounts','loans','transactions','transfers','snapshots','categories','images']
const LKEY=n=>'z8-store-'+n

async function initStorage(){
  try{
    await new Promise((res,rej)=>{
      const r=indexedDB.open(DB_NAME,DB_VER)
      r.onupgradeneeded=e=>{const d=e.target.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true})})}
      r.onsuccess=()=>{db=r.result;res()}
      r.onerror=()=>rej(r.error||new Error('idb open failed'))
      r.onblocked=()=>rej(new Error('idb blocked'))
    })
    backend='idb'
  }catch(e){
    backend='local'
  }
}

function idbGet(name,id){return new Promise((res,rej)=>{const r=db.transaction(name,'readonly').objectStore(name).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbAll(name){return new Promise((res,rej)=>{const r=db.transaction(name,'readonly').objectStore(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbPut(name,obj){return new Promise((res,rej)=>{const r=db.transaction(name,'readwrite').objectStore(name).put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbDel(name,id){return new Promise((res,rej)=>{const r=db.transaction(name,'readwrite').objectStore(name).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function idbClear(name){return new Promise((res,rej)=>{const r=db.transaction(name,'readwrite').objectStore(name).clear();r.onsuccess=res;r.onerror=()=>rej(r.error)})}

function localAll(name){try{return JSON.parse(localStorage.getItem(LKEY(name))||'[]')}catch(e){return []}}
function localPut(name,obj){
  const arr=localAll(name)
  const o={...obj}
  if(o.id==null){
    o.id=arr.reduce((m,x)=>Math.max(m,x.id||0),0)+1
    arr.push(o)
  }else{
    const i=arr.findIndex(x=>x.id===o.id)
    if(i>=0)arr[i]=o;else arr.push(o)
  }
  try{localStorage.setItem(LKEY(name),JSON.stringify(arr))}
  catch(e){throw new Error('本地存储空间不足（图片过多）。请导出备份后删除部分凭证图片，或用 Chrome 浏览器。')}
  return Promise.resolve(o.id)
}
function localDel(name,id){
  localStorage.setItem(LKEY(name),JSON.stringify(localAll(name).filter(x=>x.id!==id)))
  return Promise.resolve()
}
function localClear(name){localStorage.removeItem(LKEY(name));return Promise.resolve()}

function all(name){return backend==='idb'?idbAll(name):Promise.resolve(localAll(name))}
function get(name,id){return backend==='idb'?idbGet(name,id):Promise.resolve(localAll(name).find(x=>x.id===id))}
function put(name,obj){return backend==='idb'?idbPut(name,obj):localPut(name,obj)}
function del(name,id){return backend==='idb'?idbDel(name,id):localDel(name,id)}
function clear(name){return backend==='idb'?idbClear(name):localClear(name)}

/* ============ 设置（localStorage） ============ */
function getSettings(){try{return Object.assign({periodStartDay:1,defaultBeneficiary:'',defaultAccountId:null},JSON.parse(localStorage.getItem('z8-settings')||'{}'))}catch(e){return {periodStartDay:1,defaultBeneficiary:'',defaultAccountId:null}}}
function saveSettings(s){localStorage.setItem('z8-settings',JSON.stringify(s))}

/* ============ 工具 ============ */
const yuan2fen=y=>Math.round(Number(y)*100)
const fen2yuan=f=>(Number(f)||0)/100
function fmtYuan(f){return fen2yuan(f).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtPct(r){return r==null?'—':(r*100).toFixed(1)+'%'}
function pad2(n){return String(n).padStart(2,'0')}
function fmtDate(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
function nowLocal(){const d=new Date();return `${fmtDate(d)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`}
function todayStr(){return fmtDate(new Date())}
function shortDate(s){if(!s)return'';const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${Number(m[2])}月${Number(m[3])}日`:s}
function timeOnly(s){return s?s.slice(11,16):''}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// 时间字符串 "YYYY-MM-DD HH:MM:SS" ↔ datetime-local 输入值 "YYYY-MM-DDTHH:MM"
function toLocalInput(s){return s?s.slice(0,16).replace(' ','T'):''}
function fromLocalInput(s){return s?(s.replace('T',' ')+':00'):''}
function nowHM(){const d=new Date();return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`}

/* ============ 预置分类 ============ */
const DEFAULT_CATS=[
 ['餐饮','expense','#f59e0b','🍜'],['交通','expense','#3b82f6','🚌'],['购物','expense','#ec4899','🛍️'],['居住','expense','#8b5cf6','🏠'],['娱乐','expense','#06b6d4','🎮'],['医疗','expense','#ef4444','💊'],['人情','expense','#f97316','🎁'],['借出','expense','#14b8a6','🤝'],['其他','expense','#64748b','📦'],
 ['工资','income','#10b981','💰'],['奖金','income','#22c55e','🏆'],['理财收益','income','#84cc16','📈'],['收回借款','income','#14b8a6','↩️'],['其他收入','income','#64748b','💵']]
async function seedCats(){const c=await all('categories');if(c.length===0){for(const x of DEFAULT_CATS)await put('categories',{name:x[0],kind:x[1],color:x[2],icon:x[3]})}}

/* ============ 周期 / 业务逻辑 ============ */
function periodRange(date,startDay){
  startDay=Math.min(28,Math.max(1,Number(startDay)||1))
  const d=new Date(date+'T00:00:00')
  const start=(d.getDate()>=startDay)?new Date(d.getFullYear(),d.getMonth(),startDay):new Date(d.getFullYear(),d.getMonth()-1,startDay)
  const end=new Date(start.getFullYear(),start.getMonth()+1,startDay)
  return {start:fmtDate(start),end:fmtDate(end)}
}
async function getData(){
  const [accounts,loans,transactions,transfers,snapshots,categories]=await Promise.all(STORES.slice(0,6).map(all))
  return {accounts,loans,transactions,transfers,snapshots,categories}
}
function computeBalances(d){
  const m=new Map()
  for(const a of d.accounts){
    let bal=(a.initial_amount||0)+(a.adjustment||0)
    for(const t of d.transfers){if(t.to_account_id===a.id)bal+=t.amount;if(t.from_account_id===a.id)bal-=t.amount}
    for(const t of d.transactions){if(t.account_id===a.id){bal+=t.type==='income'?t.amount:-t.amount}}
    m.set(a.id,{...a,flow_balance:bal,balance:bal,latest_snapshot:null,loan:null,snaps:null})
  }
  for(const s of d.snapshots){const a=m.get(s.account_id);if(a){a.snaps=(a.snaps||[]);a.snaps.push(s)}}
  for(const a of m.values()){if(a.snaps&&a.snaps.length){a.snaps.sort((x,y)=>x.recorded_at.localeCompare(y.recorded_at)||x.id-y.id);a.latest_snapshot=a.snaps[a.snaps.length-1].value}}
  for(const l of d.loans){const a=m.get(l.account_id);if(a){a.loan=l;l.account=a;l.accrued=accruedInterest(l);const outstanding=l.principal-(l.settled_amount||0);a.balance=(l.status==='active')?(l.direction==='out'?outstanding:-outstanding):0}}
  // 投资账户用市值（current_value）
  for(const a of m.values()){if(a.type==='investment'&&a.current_value!=null)a.balance=a.current_value}
  return m
}
function accruedInterest(l){const start=new Date(l.lent_at).getTime(),end=Date.now();const years=(end-start)/(365.25*24*3600*1000);return Math.max(0,Math.round((l.principal*(l.interest_rate||0)/100)*years))}
function assetSummary(accts){
  let total=0;const byType={savings:0,investment:0,loan_out:0,loan_in:0,cash:0,other:0}
  for(const a of accts){
    if(a.archived)continue
    if(a.type==='loan_out'&&a.loan&&a.loan.status==='bad_debt')continue
    total+=a.balance;byType[a.type]=(byType[a.type]||0)+a.balance
  }
  return {total,byType}
}
function summary(transactions,date,startDay){
  const {start,end}=periodRange(date,startDay)
  let ti=0,te=0,pi=0,pe=0,ti_all=0,te_all=0
  for(const t of transactions){
    const h=t.happened_at.slice(0,10)
    if(t.type==='income'){
      ti_all+=t.amount
      if(h===date)ti+=t.amount
      if(h>=start&&h<end)pi+=t.amount
    }else{
      te_all+=t.amount
      if(h===date)te+=t.amount
      if(h>=start&&h<end)pe+=t.amount
    }
  }
  return {start,end,todayIncome:ti,todayExpense:te,periodIncome:pi,periodExpense:pe,periodBalance:pi-pe,savingsRate:pi>0?(pi-pe)/pi:null,totalBalance:ti_all-te_all}
}
function breakdown(transactions,range,by){
  const {start,end}=range,map=new Map()
  for(const t of transactions){
    if(t.type!=='expense')continue
    const h=t.happened_at.slice(0,10)
    if(h<start||h>=end)continue
    const k=(by==='beneficiary'?(t.beneficiary||'未分类'):(t.category||'未分类'))
    if(!map.has(k))map.set(k,{name:k,total:0,count:0})
    const e=map.get(k);e.total+=t.amount;e.count++
  }
  const items=[...map.values()].sort((a,b)=>b.total-a.total)
  return {by,start,end,grand:items.reduce((a,i)=>a+i.total,0),items}
}
function dailyBalances(transactions){
  const byDate=new Map()
  for(const t of transactions){
    const d=t.happened_at.slice(0,10)
    if(!byDate.has(d))byDate.set(d,{income:0,expense:0})
    const e=byDate.get(d)
    if(t.type==='income')e.income+=t.amount;else e.expense+=t.amount
  }
  const dates=[...byDate.keys()].sort()
  let bal=0
  const arr=dates.map(d=>{const e=byDate.get(d);bal+=e.income-e.expense;return {date:d,balance:bal,income:e.income,expense:e.expense}})
  const td=todayStr()
  if(arr.length&&arr[arr.length-1].date<td)arr.push({date:td,balance:arr[arr.length-1].balance,income:0,expense:0})
  return arr
}
function beneficiarySuggestions(transactions){
  const sorted=[...transactions].sort((a,b)=>b.happened_at.localeCompare(a.happened_at))
  const seen=new Set(),list=[]
  for(const t of sorted){if(t.type!=='expense'||!t.beneficiary)continue;if(!seen.has(t.beneficiary)){seen.add(t.beneficiary);list.push(t.beneficiary)}}
  return list.slice(0,8)
}

/* ============ SVG 图表 ============ */
function donutSVG(items,size=170,irRatio=0.62){
  const total=items.reduce((a,i)=>a+i.value,0)
  if(total<=0)return '<div class="empty">暂无数据</div>'
  const cx=size/2,cy=size/2,r=size/2-2,ir=r*irRatio
  let angle=-Math.PI/2,paths=''
  for(const i of items){
    const a1=angle,a2=angle+(i.value/total)*Math.PI*2;angle=a2
    const la=a2-a1>Math.PI?1:0
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2)
    const ix1=cx+ir*Math.cos(a2),iy1=cy+ir*Math.sin(a2),ix2=cx+ir*Math.cos(a1),iy2=cy+ir*Math.sin(a1)
    paths+=`<path d="M ${x1} ${y1} A ${r} ${r} 0 ${la} 1 ${x2} ${y2} L ${ix1} ${iy1} A ${ir} ${ir} 0 ${la} 0 ${ix2} ${iy2} Z" fill="${i.color}"/>`
  }
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="max-height:${size}px">${paths}</svg>`
}
function niceScale(min,max){
  const range=max-min
  if(range<=0){const pad=Math.abs(max)*0.1||100;return {min:min-pad,max:max+pad}}
  const rough=range/4
  const mag=Math.pow(10,Math.floor(Math.log10(rough)))
  const norm=rough/mag
  let step
  if(norm<1.5)step=mag;else if(norm<3)step=2*mag;else if(norm<7)step=5*mag;else step=10*mag
  return {min:Math.floor(min/step)*step,max:Math.ceil(max/step)*step,step}
}
function fmtAxis(v){const y=v/100;if(Math.abs(y)>=10000)return (y/10000).toFixed(1)+'万';return String(Math.round(y))}
function lineChartSVG(series,opts={}){
  const fill=opts.fill||false,H=opts.height||220
  const dates=[...new Set(series.flatMap(s=>s.points.map(p=>p.date)))].sort()
  if(dates.length===0)return '<div class="empty">暂无数据</div>'
  const rows=dates.map(date=>{const row={date};series.forEach(s=>{let v=null;for(const p of s.points){if(p.date<=date)v=p.value;else break}row[s.name]=v});return row})
  const allVals=rows.flatMap(r=>series.map(s=>r[s.name]).filter(v=>v!=null))
  if(allVals.length===0)return '<div class="empty">暂无数据</div>'
  const dMin=Math.min(...allVals),dMax=Math.max(...allVals)
  const pad=(dMax-dMin)*0.1||Math.abs(dMax)*0.1||100
  const sc=niceScale(dMin-pad,dMax+pad)
  const W=360,pl=48,pr=12,pt=10,pb=26
  const xFor=i=>pl+(dates.length===1?0:i*(W-pl-pr)/(dates.length-1))
  const yFor=v=>pt+(sc.max-v)/(sc.max-sc.min)*(H-pt-pb)
  let grid='',ylabels=''
  const ticks=[]
  for(let v=sc.min;v<=sc.max+0.001;v+=sc.step)ticks.push(v)
  ticks.forEach(v=>{const y=yFor(v);grid+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#eef0f3" stroke-dasharray="3 3"/>`;ylabels+=`<text x="${pl-6}" y="${y+4}" font-size="10" fill="#9ca3af" text-anchor="end">${fmtAxis(v)}</text>`})
  const tick=dates.length>6?Math.ceil(dates.length/5):1
  let xlabels=''
  dates.forEach((d,i)=>{if(i%tick===0||i===dates.length-1)xlabels+=`<text x="${xFor(i)}" y="${H-8}" font-size="10" fill="#9ca3af" text-anchor="middle">${d.slice(5)}</text>`})
  const lines=series.map(s=>{
    const pts=rows.map((r,i)=>({x:xFor(i),y:r[s.name]==null?null:yFor(r[s.name])}))
    let d='',prevX=null,prevY=null
    for(const p of pts){if(p.y==null){prevX=prevY=null;continue}d+=(prevX==null?`M ${p.x} ${p.y}`:` L ${p.x} ${p.y}`);prevX=p.x;prevY=p.y}
    const dots=pts.filter(p=>p.y!=null).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${s.color}"/>`).join('')
    let area=''
    if(fill){
      const first=pts.find(p=>p.y!=null),last=[...pts].reverse().find(p=>p.y!=null)
      if(first&&last){const base=yFor(sc.min);area=`<path d="${d} L ${last.x} ${base} L ${first.x} ${base} Z" fill="${s.color}" opacity="0.12"/>`}
    }
    return area+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`
  }).join('')
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${ylabels}${xlabels}${lines}</svg>`
}
function balanceLineSVG(transactions,spanDays){
  const daily=dailyBalances(transactions)
  if(daily.length===0)return '<div class="empty">暂无数据</div>'
  let points=daily.map(d=>({date:d.date,value:d.balance}))
  if(spanDays){
    const cut=new Date();cut.setDate(cut.getDate()-(spanDays-1))
    const cutStr=fmtDate(cut)
    points=points.filter(p=>p.date>=cutStr)
  }
  if(points.length===0)return '<div class="empty">该时间跨度暂无数据</div>'
  return lineChartSVG([{name:'结余',color:'#0ea5a3',points}],{fill:true,height:230})
}

async function renderAssets(){
  const d=await getData()

  const sum=assetSummary(accts)
  const loans=d.loans.sort((a,b)=>({active:0,settled:1,bad_debt:2}[a.status]-{active:0,settled:1,bad_debt:2}[b.status])||b.id-a.id)
  const active=loans.filter(l=>l.status==='active'),settled=loans.filter(l=>l.status==='settled'),bad=loans.filter(l=>l.status==='bad_debt')

  const lineColors=['#0ea5a3','#3b82f6','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#84cc16']

  const returnRates={}
  for(const a of accts){if(a.type!=='investment')continue;const base=a.initial_amount||(a.snaps&&a.snaps[0]&&a.snaps[0].value);if(base)returnRates[a.id]=(a.balance-base)/base}

  document.getElementById('page-assets').innerHTML=`
    <div class="stat-row" style="margin-top:0">
      <div class="stat"><div class="label">总资产</div><div class="value">¥${fmtYuan(sum.total)}</div></div>
      <div class="stat"><div class="label">投资款</div><div class="value accent">¥${fmtYuan(sum.byType.investment)}</div></div>
      <div class="stat"><div class="label">借出</div><div class="value income">¥${fmtYuan(sum.byType.loan_out)}</div></div>
      <div class="stat"><div class="label">借债</div><div class="value expense">¥${fmtYuan(Math.abs(sum.byType.loan_in||0))}</div></div>
    </div>
    <div class="two-col">
      <div class="card">
        <div class="card-title">资产账户<span class="flex" style="margin-left:auto;gap:6px"><button class="btn sm" onclick="openTransfer()">转账</button><button class="btn sm primary" onclick="openAddAccount()">＋ 账户</button></span></div>
        ${accts.filter(a=>!a.archived).map(a=>{const m=TYPE_META[a.type]||TYPE_META.other;const isLoan=!!a.loan;return `
          <div class="acct-item">
            <div class="acct-avatar">${m.icon}</div>
            <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(a.name)}</div>
            <div class="muted" style="font-size:12px">${m.label}${isLoan&&a.loan.status?` · ${STATUS_META[a.loan.status].label}`:''}${a.type==='investment'&&returnRates[a.id]!=null?` <span style="color:var(--accent)">· 回报率 ${fmtPct(returnRates[a.id])}</span>`:''}</div></div>
            <div style="text-align:right"><div style="font-weight:700;color:${a.balance<0?'var(--expense)':''}">¥${fmtYuan(a.balance)}</div>
            <div class="acct-actions">${!isLoan?`<button class="btn sm" onclick="openSnapshot(${a.id})">更新</button>`:''}<button class="btn sm" onclick="openEditAccount(${a.id})">编辑</button><button class="btn sm danger" onclick="deleteAccount(${a.id})">删除</button></div></div>
          </div>`}).join('')}
      </div>
      <div class="card">
        <div class="card-title">借条记录<span class="flex" style="margin-left:auto;gap:6px"><button class="btn sm" onclick="openLoan('in')">＋ 借债</button><button class="btn sm primary" onclick="openLoan('out')">＋ 借出</button></span></div>
        <div class="seg" style="margin-bottom:12px">
          <button class="${loanTab==='active'?'active':''}" onclick="loanTab='active';renderAssets()">活跃（${active.length}）</button>
          <button class="${loanTab==='settled'?'active':''}" onclick="loanTab='settled';renderAssets()">已结清（${settled.length}）</button>
          <button class="${loanTab==='bad_debt'?'active':''}" onclick="loanTab='bad_debt';renderAssets()">坏账（${bad.length}）</button>
        </div>
        ${tabList.length===0?'<div class="empty">暂无记录</div>':tabList.map(l=>`
          <div class="acct-item">
            <div class="acct-avatar">${l.direction==='out'?'🤝':'🧾'}</div>
            <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(l.counterparty)}<span class="badge ${STATUS_META[l.status].cls}">${STATUS_META[l.status].label}</span></div>
            <div class="muted" style="font-size:12px">本金 ¥${fmtYuan(l.principal)} · 年息 ${l.interest_rate||0}% · ${shortDate(l.lent_at)}${l.status==='active'?` · 应计利息 ¥${fmtYuan(l.accrued)}`:''}${(l.attachment_ids||[]).length?` · 📎×${l.attachment_ids.length}`:''}</div></div>
            <div style="text-align:right"><div style="font-weight:700">¥${fmtYuan(l.status==='active'?(l.principal-(l.settled_amount||0)):(l.settled_amount||0))}</div>
            ${(l.attachment_ids||[]).length?`<button class="btn sm" onclick="openAttachments(${l.id})">凭证</button>`:''}
            ${l.status==='active'?`<span class="flex" style="gap:6px;margin-top:4px;justify-content:flex-end"><button class="btn sm" onclick="openRecover(${l.id})">收回</button><button class="btn sm danger" onclick="markBad(${l.id})">坏账</button></span>`:''}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-title">资产增长总览<span class="hint">在账户上点「更新」记录价值快照后生成曲线</span></div>
      ${series.length===0?'<div class="empty">暂无价值曲线</div>':lineChartSVG(series,{height:220})}
    </div>`
}

async function saveAccount(){

  await put('accounts',{name,type:document.getElementById('aType').value,initial_amount:yuan2fen(document.getElementById('aInit').value||0),current_value:null,note:document.getElementById('aNote').value||null,archived:0,created_at:nowLocal()})

function openSnapshot(id){
  getData().then(d=>{
    const accts=[...computeBalances(d).values()]
    const a=accts.find(x=>x.id===id)
    if(!a)return
    showModal(`<div class="modal-head"><div class="modal-title">更新价值 · ${esc(a.name)}</div><button class="close-x" onclick="closeModal()">✕</button></div>
      <div class="field"><label>当前价值（元）</label><input id="sVal" type="number" inputmode="decimal" value="${fen2yuan(a.balance).toFixed(2)}"></div>
      <div class="field"><label>备注（可选）</label><input id="sNote" placeholder="例如：加仓 / 涨了"></div>
      <div class="flex spread mt-12"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveSnapshot(${id})">记录</button></div>`)
    setTimeout(()=>{const e=document.getElementById('sVal');e.focus();e.select()},50)
  })
}
async function saveSnapshot(id){
  const val=yuan2fen(document.getElementById('sVal').value);if(val==null||val<0)return alert('请输入价值')
  const a=await get('accounts',id)
  await put('snapshots',{account_id:id,value:val,note:document.getElementById('sNote').value||null,recorded_at:nowLocal(),created_at:nowLocal()})
  if(a.type==='investment'){
    await put('accounts',{...a,current_value:val})
  }else{
    // 非投资账户：更新价值 = 设余额为 val，之后流水继续在其上累加
    const d=await getData()
    let flow=(a.initial_amount||0)
    for(const t of d.transfers){if(t.to_account_id===id)flow+=t.amount;if(t.from_account_id===id)flow-=t.amount}
    for(const t of d.transactions){if(t.account_id===id)flow+=(t.type==='income'?t.amount:-t.amount)}
    await put('accounts',{...a,adjustment:val-flow})
  }
  closeModal();renderAssets()
}
async function openEditAccount(id){
  const a=await get('accounts',id)
  const isLoan=a.type==='loan_out'||a.type==='loan_in'

      <div class="field"><label>账户名称</label><input id="eName" value="${esc(a.name)}"></div>
      <div class="field"><label>账户类型</label><select id="eType">${Object.entries(TYPE_META).map(([k,m])=>`<option value="${k}" ${a.type===k?'selected':''}>${m.icon} ${m.label}</option>`).join('')}</select></div>
      <div class="field"><label>${isInv?'投入本金':'初始金额'}（元）</label><input id="eInit" type="number" inputmode="decimal" value="${fen2yuan(a.initial_amount||0).toFixed(2)}"></div>
      ${isInv?`<div class="field"><label>当前市值（元，留空按本金+流水）</label><input id="eCur" type="number" inputmode="decimal" value="${a.current_value!=null?fen2yuan(a.current_value).toFixed(2):''}" placeholder="自动"></div>`:''}
      <div class="field"><label>备注</label><input id="eNote" value="${esc(a.note||'')}"></div>
      <div class="flex spread mt-12"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveEditAccount(${id})">保存</button></div>`)
  }
}
async function saveEditAccount(id){
  const a=await get('accounts',id)
  const isLoan=a.type==='loan_out'||a.type==='loan_in'
  const name=document.getElementById('eName').value.trim();if(!name)return alert('请输入名称')
  if(isLoan){
    const d=await getData();const l=d.loans.find(x=>x.account_id===id)
    const principal=yuan2fen(document.getElementById('ePrincipal').value);if(!principal||principal<=0)return alert('请输入本金')
    const initT=d.transfers.find(t=>l.direction==='out'?t.to_account_id===id:t.from_account_id===id)
    if(initT)await put('transfers',{...initT,amount:principal})
    await put('accounts',{...a,name})
    await put('loans',{...l,counterparty:name,principal,interest_rate:Number(document.getElementById('eRate').value)||0,lent_at:document.getElementById('eLent').value||l.lent_at,due_at:document.getElementById('eDue').value||null,note:document.getElementById('eNote').value||null})
  }else{
    const newType=document.getElementById('eType').value
    if(newType==='investment'){
      const cur=document.getElementById('eCur').value
      await put('accounts',{...a,name,type:newType,initial_amount:yuan2fen(document.getElementById('eInit').value||0),current_value:cur===''?null:yuan2fen(cur),note:document.getElementById('eNote').value||null})
    }else{
      await put('accounts',{...a,name,type:newType,initial_amount:yuan2fen(document.getElementById('eInit').value||0),note:document.getElementById('eNote').value||null})
    }
  }
  closeModal();renderAssets()
}
async function deleteAccount(id){
  const a=await get('accounts',id);if(!a)return
  const d=await getData()
  const hasLoan=d.loans.some(l=>l.account_id===id)
  if(!confirm(`确定删除账户「${a.name}」？${hasLoan?'其关联的借条及凭证将一并删除。':''}历史转账会保留（资金不会回流到其它账户）。`))return
  for(const s of d.snapshots)if(s.account_id===id)await del('snapshots',s.id)
  for(const t of d.transactions)if(t.account_id===id)await put('transactions',{...t,account_id:null})
  for(const l of d.loans)if(l.account_id===id){for(const iid of (l.attachment_ids||[]))await del('images',iid);await del('loans',l.id)}
  await del('accounts',id)
  closeModal();renderAssets()
}

  const files=[...e.target.files]

async function saveLoan(){
  const name=document.getElementById('lName').value.trim();if(!name)return alert(loanDir==='out'?'请输入借款人':'请输入债主')

async function saveRecover(id){
  const l=await get('loans',id)
  const amt=yuan2fen(document.getElementById('rAmt').value);if(!amt||amt<=0)return alert('请输入金额')
  const to=Number(document.getElementById('rAcct').value);if(!to)return alert('请选择回笼账户')
  const settled=(l.settled_amount||0)+amt,isFull=settled>=l.principal
  await put('transfers',{from_account_id:l.account_id,to_account_id:to,amount:amt,note:'收回',transferred_at:nowLocal(),created_at:nowLocal()})
  await put('loans',{...l,settled_amount:settled,status:isFull?'settled':'active',settled_at:isFull?nowLocal():null})
  closeModal();renderAssets()
}
async function markBad(id){
  const l=await get('loans',id)
  if(!confirm(`确认将「${l.counterparty}」标记为坏账？标记后将从总资产剔除，但记录保留可统计。`))return
  await put('loans',{...l,status:'bad_debt'})
  renderAssets()
}
async function openAttachments(id){
  const l=await get('loans',id)
  const ids=l.attachment_ids||[]
  const imgs=[]
  for(const iid of ids){const img=await get('images',iid);if(img)imgs.push(img)}
  showModal(`<div class="modal-head"><div class="modal-title">凭证 · ${esc(l.counterparty)}</div><button class="close-x" onclick="closeModal()">✕</button></div>
    ${imgs.length===0?'<div class="empty">无图片</div>':imgs.map(i=>`<div class="mt-8"><img class="thumb lg" src="${i.dataUrl}"></div>`).join('')}`)
}

/* ---- 存储状态指示 / 迁移 ---- */
function updateFooter(){
  const f=document.querySelector('.footer')
  if(!f)return
  if(backend==='idb'){
    f.innerHTML='存储：IndexedDB ✓（可存图片） · <a href="#" onclick="openBackup(event)" style="color:var(--accent)">导出备份</a> · <a href="#" onclick="openImport(event)" style="color:var(--accent)">导入</a>'
  }else{
    f.innerHTML='存储：本地备用（容量有限） · <a href="#" onclick="migrateToIdb(event)" style="color:var(--accent)">迁移到 IndexedDB</a> · <a href="#" onclick="openBackup(event)" style="color:var(--accent)">导出备份</a> · <a href="#" onclick="openImport(event)" style="color:var(--accent)">导入</a>'
  }
}
async function migrateToIdb(e){
  if(e)e.preventDefault()
  try{
    const tmp=await new Promise((res,rej)=>{
      const r=indexedDB.open(DB_NAME,DB_VER)
      r.onupgradeneeded=ev=>{const d=ev.target.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true})})}
      r.onsuccess=()=>res(r.result)
      r.onerror=()=>rej(r.error||new Error('idb open failed'))
      r.onblocked=()=>rej(new Error('idb blocked'))
    })
    // 若 IndexedDB 已有数据，先确认，避免覆盖
    let idbCount=0
    for(const s of STORES){const r=tmp.transaction(s,'readonly').objectStore(s).count();await new Promise(res=>{r.onsuccess=()=>{idbCount+=r.result;res()}})}
    if(idbCount>0 && !confirm('IndexedDB 中已有数据，迁移会与其合并（相同编号会覆盖）。建议先导出备份。是否继续？'))return
    for(const s of STORES){
      const data=localAll(s)
      if(data.length){
        const store=tmp.transaction(s,'readwrite').objectStore(s)
        for(const rec of data)store.put(rec)
      }
    }
    db=tmp;backend='idb'
    STORES.forEach(s=>localStorage.removeItem(LKEY(s)))
    alert('迁移完成！已切换到 IndexedDB，可正常存储图片凭证。')
    updateFooter();renderLedger();renderAssets()
  }catch(err){
    alert('当前仍无法使用 IndexedDB：'+err.message+'。\n\n请改用「网址」方式访问（见下方说明）：托管到 GitHub Pages 等免费静态托管，或用本地服务器 http:// 访问。')
  }
}

/* ---- 备份 / 导入 ---- */
function openBackup(e){e.preventDefault();getData().then(async d=>{
  const images=await all('images')
  const payload={version:2,exported_at:nowLocal(),settings:getSettings(),categories:d.categories,accounts:d.accounts,loans:d.loans,transactions:d.transactions,transfers:d.transfers,snapshots:d.snapshots,images}
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'})
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Z8记账备份-${todayStr()}.json`;a.click()
})}
function openImport(e){
  e.preventDefault()
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json'
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importData(JSON.parse(r.result))}catch(err){alert('导入失败：文件格式不正确')}};r.readAsText(f)}
  inp.click()
}
async function importData(p){
  if(!p.categories)return alert('无效的备份文件')
  if(!confirm('导入将覆盖当前全部数据，确定继续？'))return
  for(const s of STORES)await clear(s)
  if(p.settings)saveSettings(p.settings)
  for(const c of p.categories||[])await put('categories',{...c})
  for(const a of p.accounts||[])await put('accounts',{...a})
  for(const l of p.loans||[])await put('loans',{...l})
  for(const t of p.transactions||[])await put('transactions',{...t})
  for(const t of p.transfers||[])await put('transfers',{...t})
  for(const s of p.snapshots||[])await put('snapshots',{...s})
  for(const i of p.images||[])await put('images',{...i})
  alert('导入完成')
  renderLedger();renderAssets()
}

  await initStorage()
